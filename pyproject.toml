[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sturgis-core"
version = "0.2.0"
description = "Portable persistent agent with consumer services and isolated native memory"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.23.0", "httpx==0.28.1", "starlette==1.6.0", "uvicorn==0.52.4", "cryptography==50.0.1", "websockets==17.1"]

[project.scripts]
sturgis = "consumer.cli:main"
sturgis-gateway = "model_gateway.__main__:main"

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-asyncio==0.25.3", "coverage==7.10.7", "pytest-cov==6.0.0", "gcovr==8.3"]

[tool.setuptools.packages.find]
include = ["agent*", "consumer*", "model_gateway*"]

[tool.setuptools.package-data]
consumer = ["web/*.html", "web/assets/*", "bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["agent", "consumer", "model_gateway"]
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "evidence/sturgis-01/python-html"
