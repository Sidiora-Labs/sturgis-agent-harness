<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 545" role="img" aria-labelledby="title desc"><title id="title">Sturgis continuity and authority flow</title><desc id="desc">Clients enter authenticated admission and durable state. The runtime schedules labeled context and model work, validates proposed effects, and records receipts for delivery. Native memory runs separately and provides bounded evidence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6750a4"/></marker></defs><rect width="1050" height="545" rx="22" fill="#f8f7fc"/><rect x="32" y="40" width="240" height="80" rx="17" fill="#eee7f8" stroke="#cfc1e7"/><text x="152.0" y="71" text-anchor="middle" fill="#352849" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Clients and external input</text><text x="152.0" y="95" text-anchor="middle" fill="#51465e" font-family="system-ui,sans-serif" font-size="12">Web · CLI · ACP · channels</text><rect x="352" y="40" width="260" height="80" rx="17" fill="#eee7f8" stroke="#cfc1e7"/><text x="482.0" y="71" text-anchor="middle" fill="#352849" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Authenticated admission</text><text x="482.0" y="95" text-anchor="middle" fill="#51465e" font-family="system-ui,sans-serif" font-size="12">Identity · scope · stable request ID</text><rect x="712" y="40" width="300" height="80" rx="17" fill="#eee7f8" stroke="#cfc1e7"/><text x="862.0" y="71" text-anchor="middle" fill="#352849" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Durable operational state</text><text x="862.0" y="95" text-anchor="middle" fill="#51465e" font-family="system-ui,sans-serif" font-size="12">Journal · revisions · event cursors</text><rect x="32" y="220" width="240" height="80" rx="17" fill="#eee7f8" stroke="#cfc1e7"/><text x="152.0" y="251" text-anchor="middle" fill="#352849" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Context and memory</text><text x="152.0" y="275" text-anchor="middle" fill="#51465e" font-family="system-ui,sans-serif" font-size="12">Labeled packets · evidence · budgets</text><rect x="352" y="220" width="260" height="80" rx="17" fill="#eee7f8" stroke="#cfc1e7"/><text x="482.0" y="251" text-anchor="middle" fill="#352849" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Runtime and scheduler</text><text x="482.0" y="275" text-anchor="middle" fill="#51465e" font-family="system-ui,sans-serif" font-size="12">Admission · grants · timers · recovery</text><rect x="712" y="220" width="300" height="80" rx="17" fill="#eee7f8" stroke="#cfc1e7"/><text x="862.0" y="251" text-anchor="middle" fill="#352849" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Model and proposed actions</text><text x="862.0" y="275" text-anchor="middle" fill="#51465e" font-family="system-ui,sans-serif" font-size="12">Streaming output · typed tool calls</text><rect x="32" y="405" width="240" height="80" rx="17" fill="#eee7f8" stroke="#cfc1e7"/><text x="152.0" y="436" text-anchor="middle" fill="#352849" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Native memory process</text><text x="152.0" y="460" text-anchor="middle" fill="#51465e" font-family="system-ui,sans-serif" font-size="12">Records · concepts · generations</text><rect x="352" y="405" width="260" height="80" rx="17" fill="#eee7f8" stroke="#cfc1e7"/><text x="482.0" y="436" text-anchor="middle" fill="#352849" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Validated effects</text><text x="482.0" y="460" text-anchor="middle" fill="#51465e" font-family="system-ui,sans-serif" font-size="12">Tools · files · processes · adapters</text><rect x="712" y="405" width="300" height="80" rx="17" fill="#eee7f8" stroke="#cfc1e7"/><text x="862.0" y="436" text-anchor="middle" fill="#352849" font-family="system-ui,sans-serif" font-size="17" font-weight="600">Receipts and delivery</text><text x="862.0" y="460" text-anchor="middle" fill="#51465e" font-family="system-ui,sans-serif" font-size="12">Observed outcomes · durable outbox</text><path d="M272 80H352" fill="none" stroke="#6750a4" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M612 80H712" fill="none" stroke="#6750a4" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M840 120V165H482V220" fill="none" stroke="#6750a4" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M352 260H272" fill="none" stroke="#6750a4" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M612 260H712" fill="none" stroke="#6750a4" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M862 300V350H482V405" fill="none" stroke="#6750a4" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M152 300V405" fill="none" stroke="#6750a4" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M612 445H712" fill="none" stroke="#6750a4" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M1012 445H1028V160H925V120" fill="none" stroke="#6750a4" stroke-width="2.4" marker-end="url(#arrow)"/><text x="525" y="522" text-anchor="middle" fill="#51465e" font-family="system-ui,sans-serif" font-size="12">Evidence informs decisions. Runtime grants authorize effects. Input and output remain independently serviceable.</text></svg>